<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Real-Time Chat App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        #login-screen {
            padding: 30px;
            text-align: center;
            justify-content: center;
            height: auto;
        }

        #login-screen h2 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .login-input:focus {
            border-color: #4f46e5;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        #error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        #chat-screen {
            display: none;
        }

        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px #22c55e;
        }

        /* Typing indicator text below header */
        #typing-indicator {
            font-size: 12px;
            color: #64748b;
            padding: 4px 20px;
            background: #f1f5f9;
            height: 22px;
            font-style: italic;
            display: none;
            flex-shrink: 0;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-card {
            background: #e2e8f0;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .message-card.self {
            background: #4f46e5;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message-card.other {
            background: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sender-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            opacity: 0.8;
            font-weight: bold;
            gap: 15px;
        }

        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            font-size: 10px;
            opacity: 0.8;
        }

        /* Tick styling for Sent/Seen */
        .tick {
            font-size: 12px;
            font-weight: bold;
        }
        .tick.sent {
            color: #cbd5e1; /* Gray single/double tick */
        }
        .tick.seen {
            color: #38bdf8; /* Blue double tick for seen */
        }

        .chat-input-area {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        #message {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        #message:focus {
            border-color: #4f46e5;
        }

        button.send-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.send-btn:hover {
            background: #4338ca;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <h2>🔐 Enter Chat</h2>
        <input type="text" id="login-username" class="login-input" placeholder="Enter your username..." />
        <input type="password" id="login-password" class="login-input" placeholder="Enter password..." />
        <button id="login-btn" class="login-btn">Join Chat</button>
        <div id="error-msg">Incorrect Password!</div>
    </div>

    <!-- 2. CHAT SCREEN -->
    <div id="chat-screen" class="card" style="display: none;">
        <div class="chat-header">
            <span>💬 Chat App</span>
            <div class="header-right">
                <span title="Online"><span class="status-dot"></span></span>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
        </div>
        
        <!-- Typing Indicator Bar -->
        <div id="typing-indicator"></div>

        <div id="chat-box"></div>
        
        <div class="chat-input-area">
            <input type="text" id="message" placeholder="Type a message..." />
            <button id="send" class="send-btn">Send</button>
        </div>
    </div>

    <!-- Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const loginBtn = document.getElementById('login-btn');
        const loginUsernameInput = document.getElementById('login-username');
        const loginPasswordInput = document.getElementById('login-password');
        const errorMsg = document.getElementById('error-msg');
        const logoutBtn = document.getElementById('logout-btn');

        const sendBtn = document.getElementById('send');
        const messageInput = document.getElementById('message');
        const chatBox = document.getElementById('chat-box');
        const typingIndicator = document.getElementById('typing-indicator');

        let currentUser = localStorage.getItem('chat_username') || '';
        let typingTimeout = null;

        if (currentUser) {
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            loadLocalHistory();
        }

        loginBtn.addEventListener('click', () => {
            const username = loginUsernameInput.value.trim();
            const password = loginPasswordInput.value.trim();

            if (username === '') {
                errorMsg.innerText = "Please enter a username!";
                errorMsg.style.display = 'block';
                return;
            }

            if (password === '272009') {
                currentUser = username;
                localStorage.setItem('chat_username', currentUser);
                loginScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadLocalHistory();
            } else {
                errorMsg.innerText = "Incorrect Password!";
                errorMsg.style.display = 'block';
            }
        });

        loginPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('chat_username');
            location.reload();
        });

        // --- TYPING EVENT DETECTION ---
        messageInput.addEventListener('input', () => {
            socket.emit('typing', currentUser);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('stop_typing');
            }, 1000); // 1 second ke baad typing stop show hoga
        });

        socket.on('display_typing', (username) => {
            typingIndicator.innerText = `${username} is typing...`;
            typingIndicator.style.display = 'block';
        });

        socket.on('hide_typing', () => {
            typingIndicator.innerText = '';
            typingIndicator.style.display = 'none';
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message !== "") {
                socket.emit('stop_typing'); // Message bhejte hi typing stop kar do
                const messageData = { 
                    sender: currentUser, 
                    message: message, 
                    id: socket.id 
                };
                socket.emit('send_message', messageData);
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('load_history', (history) => {
            localStorage.setItem('chat_history', JSON.stringify(history));
            if(currentUser) loadLocalHistory();
        });

        socket.on('receive_message', (data) => {
            saveAndDisplayMessage(data);
        });

        function saveAndDisplayMessage(data) {
            let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
            
            chatHistory.push(data);
            if (chatHistory.length > 200) chatHistory.shift();
            
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));
            renderMessage(data);
        }

        function renderMessage(data) {
            const div = document.createElement('div');
            const isSelf = data.sender === currentUser;
            div.className = `message-card ${isSelf ? 'self' : 'other'}`;

            // Sent aur Seen (Ticks) logic
            // Khud ke message par blue double tick (seen) dikhega, doosre ke message par time dikhega
            const tickHtml = isSelf ? `<span class="tick seen" title="Seen">✓✓</span>` : '';

            div.innerHTML = `
                <div class="sender-info">
                    <span>${data.sender}</span>
                </div>
                <div>${data.message}</div>
                <div class="msg-footer">
                    <span class="msg-time">${data.time || ''}</span>
                    ${tickHtml}
                </div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function loadLocalHistory() {
            chatBox.innerHTML = '';
            let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
            chatHistory.forEach(data => {
                renderMessage(data);
            });
        }
    </script>
</body>
</html>
