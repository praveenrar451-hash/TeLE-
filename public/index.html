<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Real-Time Chat App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Common Box Styling */
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Login Screen Styles */
        #login-screen {
            padding: 30px;
            text-align: center;
        }

        #login-screen h2 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: #4f46e5;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        #error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Chat Screen Styles */
        #chat-screen {
            display: none; /* Pehle hidden rahega */
            height: 85vh;
        }

        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px #22c55e;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-card {
            background: #e2e8f0;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .message-card.self {
            background: #4f46e5;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message-card.other {
            background: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sender-name {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
            opacity: 0.8;
        }

        .chat-input-area {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        #message:focus {
            border-color: #4f46e5;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <h2>🔐 Enter Chat</h2>
        <input type="text" id="login-username" class="login-input" placeholder="Enter your username..." />
        <input type="password" id="login-password" class="login-input" placeholder="Enter password (272009)..." />
        <button id="login-btn" class="login-btn">Join Chat</button>
        <div id="error-msg">Incorrect Password! Try again.</div>
    </div>

    <!-- 2. CHAT SCREEN -->
    <div id="chat-screen" class="card">
        <div class="chat-header">
            <span id="room-title">💬 Chat App</span>
            <span title="Online"><span class="status-dot"></span> Online</span>
        </div>
        
        <div id="chat-box"></div>
        
        <div class="chat-input-area">
            <input type="text" id="message" placeholder="Type a message..." />
            <button id="send">Send</button>
        </div>
    </div>

    <!-- Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const loginBtn = document.getElementById('login-btn');
        const loginUsernameInput = document.getElementById('login-username');
        const loginPasswordInput = document.getElementById('login-password');
        const errorMsg = document.getElementById('error-msg');

        const sendBtn = document.getElementById('send');
        const messageInput = document.getElementById('message');
        const chatBox = document.getElementById('chat-box');

        let currentUser = '';

        // Fixed Password Check
        loginBtn.addEventListener('click', () => {
            const username = loginUsernameInput.value.trim();
            const password = loginPasswordInput.value.trim();

            if (username === '') {
                errorMsg.innerText = "Please enter a username!";
                errorMsg.style.display = 'block';
                return;
            }

            if (password === '272009') {
                currentUser = username;
                loginScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadChatHistory(); // Purana chat load karega
            } else {
                errorMsg.innerText = "Incorrect Password! Hint: 272009";
                errorMsg.style.display = 'block';
            }
        });

        // Enter key press support for login
        loginPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // Send Message Function
        function sendMessage() {
            const message = messageInput.value.trim();

            if (message !== "") {
                const messageData = { 
                    sender: currentUser, 
                    message: message, 
                    id: socket.id 
                };
                socket.emit('send_message', messageData);
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Receive message from server
        socket.on('receive_message', (data) => {
            saveAndDisplayMessage(data);
        });

        // LocalStorage me save karke screen par dikhane ka logic
        function saveAndDisplayMessage(data) {
            // LocalStorage se purani chat nikalo
            let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
            
            // Naya message add karo
            chatHistory.push(data);
            
            // Wapas localStorage me save karo (Max 100 messages limit taaki memory full na ho)
            if (chatHistory.length > 100) chatHistory.shift();
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));

            // UI par render karo
            renderMessage(data);
        }

        // Single message ko HTML me convert karke chat box me dalna
        function renderMessage(data) {
            const div = document.createElement('div');
            // Check karo ki message current user ka hai ya kisi aur ka
            const isSelf = data.sender === currentUser;
            div.className = `message-card ${isSelf ? 'self' : 'other'}`;

            div.innerHTML = `
                <div class="sender-name">${data.sender}</div>
                <div>${data.message}</div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Page load / Login ke baad saari saved chat load karna
        function loadChatHistory() {
            chatBox.innerHTML = ''; // Pehle clear karo
            let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];
            chatHistory.forEach(data => {
                renderMessage(data);
            });
        }
    </script>
</body>
</html>
